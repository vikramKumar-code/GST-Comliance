<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ctGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#0d6e59" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ctGradient)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)" />

  <!-- Bold CandidTax Monogram -->
  <g fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="-1">
    <text x="11" y="42" fill="#ffffff">C</text>
    <text x="32" y="42" fill="#ffffff">T</text>
  </g>

  <!-- Verified Compliance Golden Checkmark Badge -->
  <circle cx="50" cy="14" r="6.5" fill="url(#goldAccent)" stroke="#064e3b" stroke-width="1.5" />
  <path d="M47.2 14 l2 2 l3.8 -3.8" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
